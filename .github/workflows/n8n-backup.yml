# N8N工作流自动备份（修复版）
name: N8N工作流自动备份

# 仅保留手动触发
on:
  workflow_dispatch:

# 【重要】授予 GITHUB_TOKEN 写入仓库的权限，否则无法推送
permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装基础工具
        run: |
          sudo apt update && sudo apt install -y jq curl zip
          mkdir -p ./n8n-backups

      - name: 导出n8n工作流并打包
        env:
          # 只需配置 n8n 的 Key，不需要混合 GitHub Token
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_URL: "https://n8n.lbuding.com"  # 你的n8n地址
        run: |
          # ========== 1. 核心变量定义 ==========
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_ROOT="./n8n-backups"
          JSON_DIR="$BACKUP_ROOT/$TIMESTAMP"
          ZIP_FILENAME="n8n_backup_$TIMESTAMP.zip"
          ZIP_FILE_PATH="$BACKUP_ROOT/$ZIP_FILENAME"
          
          mkdir -p "$JSON_DIR"

          # ========== 2. 请求工作流列表 ==========
          echo "正在连接 N8N: $N8N_URL ..."
          WORKFLOW_LIST_RESPONSE=$(curl -s -X GET "$N8N_URL/api/v1/workflows" \
            -H "X-N8N-API-KEY: $N8N_API_KEY" \
            -H "Content-Type: application/json")

          # 检查 API 返回是否包含 data 字段
          if ! echo "$WORKFLOW_LIST_RESPONSE" | jq -e '.data' >/dev/null 2>&1; then
            echo "错误：无法获取工作流列表，响应内容："
            echo "$WORKFLOW_LIST_RESPONSE" | head -n 10
            exit 1
          fi

          # ========== 3. 解析并导出JSON ==========
          WORKFLOW_IDS=$(echo "$WORKFLOW_LIST_RESPONSE" | jq -r '.data[].id')
          BACKUP_COUNT=0

          # 定义重名处理函数
          get_unique_filename() {
            local base_dir=$1
            local filename=$2
            local extension=${filename##*.}
            local name_without_ext=${filename%.*}
            local unique_filename=$filename
            local counter=1
            while [ -f "$base_dir/$unique_filename" ]; do
              unique_filename="${name_without_ext}_${counter}.${extension}"
              counter=$((counter + 1))
            done
            echo "$unique_filename"
          }

          for ID in $WORKFLOW_IDS; do
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then continue; fi

            # 获取名称并清洗特殊字符
            RAW_NAME=$(echo "$WORKFLOW_LIST_RESPONSE" | jq -r --arg ID "$ID" '.data[] | select(.id == $ID) | .name')
            SAFE_NAME=$(echo "$RAW_NAME" | sed -e 's/[\/\\:*?"<>|]/_/g' -e 's/ /_/g')
            
            if [ -z "$SAFE_NAME" ] || [ "$SAFE_NAME" = "null" ]; then SAFE_NAME="未命名_$ID"; fi
            
            FILE_NAME="${SAFE_NAME}.json"
            FILE_NAME=$(get_unique_filename "$JSON_DIR" "$FILE_NAME")

            # 获取详情
            WORKFLOW_DETAIL=$(curl -s -X GET "$N8N_URL/api/v1/workflows/$ID" \
              -H "X-N8N-API-KEY: $N8N_API_KEY" | jq '.')

            if echo "$WORKFLOW_DETAIL" | jq -e '.id' >/dev/null 2>&1; then
              echo "$WORKFLOW_DETAIL" > "$JSON_DIR/$FILE_NAME"
              echo "✅ 已备份: $FILE_NAME"
              BACKUP_COUNT=$((BACKUP_COUNT + 1))
            else
              echo "⚠️  警告: 工作流 $SAFE_NAME 导出失败"
            fi
          done

          # ========== 4. 打包 ZIP ==========
          if [ $BACKUP_COUNT -gt 0 ]; then
            echo "===== 开始打包 ZIP ====="
            # 切换目录打包，避免 zip 包含层级路径
            cd "$BACKUP_ROOT"
            zip -r -q -9 "$ZIP_FILENAME" "$TIMESTAMP"
            
            # 生成 MD5 校验文件
            md5sum "$ZIP_FILENAME" > "${ZIP_FILENAME}.md5"
            echo "📦 ZIP 生成完毕: $ZIP_FILENAME"
            
            # 删除原始 JSON 文件夹，只留 ZIP
            rm -rf "$TIMESTAMP"
            cd - > /dev/null
          else
            echo "❌ 没有备份任何文件，退出"
            rm -rf "$JSON_DIR"
            exit 1
          fi

          # ========== 5. 清理旧备份 (关键修正) ==========
          echo "===== 清理旧备份 (保留最近7份: 7个zip + 7个md5 = 14个文件) ====="
          cd "$BACKUP_ROOT" || exit 1
          
          # 逻辑修正：
          # 1. ls -tp: 按时间倒序（最新的在上面）
          # 2. grep: 只选 zip 和 md5
          # 3. tail -n +15: 跳过前14行（即跳过最新的14个文件），从第15行（旧文件）开始输出
          # 4. xargs rm: 删除这些旧文件
          
          ls -tp | grep -E '^n8n_backup_.*\.(zip|md5)$' | grep -v '/$' | tail -n +15 | xargs -I {} rm -- {} || true
          
          echo "🧹 清理完成，当前剩余备份数："
          ls -tp | grep -E '\.zip$' | head -n 10
          cd - > /dev/null

      - name: 提交并推送
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add ./n8n-backups
            git commit -m "n8n自动备份 $(date +%Y-%m-%d) [Action]"
            # 直接推送到当前仓库，使用内置 Token
            git push origin HEAD:main
            echo "🚀 推送成功"
          else
            echo "无文件变动，跳过提交"
          fi
